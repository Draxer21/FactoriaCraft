plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources.srcDir('src/generated/resources')

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        // CI only: flips through the manual's recipe pages for screenshots.
        systemProperty 'factorycraft.guideDemo', System.getenv('GUIDE_DEMO') ?: 'false'
        if (System.getenv('GUIDE_DEMO')) {
            argument '--quickPlayMultiplayer'
            argument 'localhost:25565'
        }
    }
    server {
        argument '--nogui'
        // CI only: logs whether other mods can reach our items, energy and fluids.
        systemProperty 'factorycraft.selfTest', System.getenv('GUIDE_DEMO') ?: 'false'
    }
}

repositories {
    // JEI (optional recipe viewer): compiled against its API, loaded in dev runs to test the plugin.
    maven { url = 'https://maven.blamejared.com' }
    // Jade (optional block overlay): compiled against its jar from Modrinth.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly "mezz.jei:jei-${jei_mc}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_mc}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    if (minecraft_version == jei_mc) runtimeOnly "mezz.jei:jei-${jei_mc}-neoforge:${jei_version}"
}

tasks.withType(ProcessResources).configureEach {
    def props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                 neo_version: neo_version, mod_id: mod_id, mod_name: mod_name,
                 mod_license: mod_license, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

def languageFiles = fileTree('src/main/resources/assets/factorycraft/lang') {
    include '*.json'
}

tasks.register('checkLanguageKeys') {
    group = 'verification'
    description = 'Checks that every language file has the same keys as en_us.json.'
    inputs.files(languageFiles)

    doLast {
        def referenceFile = file('src/main/resources/assets/factorycraft/lang/en_us.json')
        if (!referenceFile.isFile()) {
            throw new GradleException('Missing language reference file: en_us.json')
        }

        def parser = new groovy.json.JsonSlurper()
        def reference = parser.parse(referenceFile) as Map
        def referenceKeys = new TreeSet(reference.keySet())

        languageFiles.files.findAll { it.name != 'en_us.json' }.sort { it.name }.each { languageFile ->
            def translated = parser.parse(languageFile) as Map
            def missing = referenceKeys - translated.keySet()
            def extra = translated.keySet() - referenceKeys
            if (!missing.isEmpty() || !extra.isEmpty()) {
                throw new GradleException("${languageFile.name} keys differ from en_us.json; missing: ${missing}, extra: ${extra}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn(tasks.named('checkLanguageKeys'))
}
