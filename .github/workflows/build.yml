name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '26.1'
            neo: '26.1.0.19-beta'
            range: '[26.1,26.1.2)'
          - mc: '26.1.2'
            neo: '26.1.2.122'
            range: '[26.1.2]'
    env:
      VERSION_ARGS: -Pminecraft_version=${{ matrix.mc }} -Pneo_version=${{ matrix.neo }} -Pminecraft_version_range=${{ matrix.range }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-configuration-cache > build.log 2>&1 || true
          J=$(find .gradle/repositories -name "neoforge-*.jar" | grep -v -E "sources|userdev|universal" | head -1)
          U=$(find ~/.gradle -name "neoforge-*-universal.jar" | head -1)
          CP="$J:$U:$(find ~/.gradle -name '*.jar' | tr '\n' ':')"
          {
          echo "### probe $J"; echo '```'
          javap -cp "$CP" net.neoforged.neoforge.entity.PartEntity
          javap -cp "$CP" -p net.minecraft.world.entity.boss.enderdragon.EnderDragonPart
          echo "--- Entity"; javap -cp "$CP" net.minecraft.world.entity.Entity | grep -i -E "part|multipart|canBeCollidedWith|isPickable|hurtServer|interact\(|void push\(|setId|shouldBeSaved|isAttackable|skipAttackInteraction|is\(net|getPickResult|canCollideWith|getEntityHitResult"
          echo "--- Level"; javap -cp "$CP" net.minecraft.world.level.Level | grep -i -E "part|getEntities\("
          javap -cp "$CP" -c net.minecraft.world.level.Level | grep -n -i -E "part|Method .*getEntities|EnderDragon" | head -40
          echo "--- ServerLevel"; javap -cp "$CP" net.minecraft.server.level.ServerLevel | grep -i part
          echo "--- ClientLevel"; javap -cp "$CP" net.minecraft.client.multiplayer.ClientLevel | grep -i part
          echo "--- AbstractBoat"; javap -cp "$CP" -p net.minecraft.world.entity.vehicle.boat.AbstractBoat | grep -i -E "push|collid|pickable|tick|canAddPassenger|interact" || javap -cp "$CP" -p net.minecraft.world.entity.vehicle.AbstractBoat | grep -i -E "push|collid|pickable|tick|interact"
          echo "--- EnderDragon"; javap -cp "$CP" -p net.minecraft.world.entity.boss.enderdragon.EnderDragon | grep -i -E "part|setId|tickPart|subEntities"
          echo '```'; } > report.md 2>&1
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md
