name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '26.1'
            neo: '26.1.0.19-beta'
            range: '[26.1,26.1.2)'
          - mc: '26.1.2'
            neo: '26.1.2.122'
            range: '[26.1.2]'
    env:
      VERSION_ARGS: -Pminecraft_version=${{ matrix.mc }} -Pneo_version=${{ matrix.neo }} -Pminecraft_version_range=${{ matrix.range }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-configuration-cache $VERSION_ARGS 2>&1 | tee build.log
      - name: Report errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### [${{ matrix.mc }}] Build failed'
            echo '```'
            grep -E -A3 "error:|What went wrong|FAILURE|Exception" build.log | head -c 60000
            echo '```'
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md
      - name: Publish release (jar downloadable without login)
        id: release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/mc-26.1'
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ matrix.mc }}
        run: |
          ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          jar=$(ls build/libs/*.jar | grep -v -E 'sources|javadoc' | head -1)
          tag="v${ver}-mc${MC}"
          notes="FactoryCraft ${ver} para Minecraft ${MC} (NeoForge). Se actualiza automáticamente con cada cambio; último commit: ${GITHUB_SHA::7}."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --title "FactoryCraft ${ver} — Minecraft ${MC}" --notes "$notes" --target "$GITHUB_SHA"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          gh release upload "$tag" "$jar" --clobber
      - name: Publish to CurseForge
        if: success() && github.event_name == 'push'
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: '1801433'
          CREATED: ${{ steps.release.outputs.created }}
          MESSAGE: ${{ github.event.head_commit.message }}
          MC: ${{ matrix.mc }}
        run: |
          ver=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          jar=$(ls build/libs/*.jar | grep -v -E 'sources|javadoc' | head -1)
          if [ -z "$CF_TOKEN" ]; then echo "No CurseForge token: skipped"; exit 0; fi
          api=https://minecraft.curseforge.com/api
          curl -sf -H "X-Api-Token: $CF_TOKEN" "$api/game/version-types" > cf-types.json
          curl -sf -H "X-Api-Token: $CF_TOKEN" "$api/game/versions" > cf-versions.json
          # Minecraft version: same name, in a "minecraft-..." version type. Plus loader, Java and sides.
          ids=$(jq -c --arg mc "$MC" --slurpfile types cf-types.json '
            ($types[0] | map(select(.slug | startswith("minecraft-")) | .id)) as $mcTypes
            | ($types[0] | map(select(.slug == "modloader" or .slug == "java" or .slug == "environment") | .id)) as $other
            | [ .[] | select((.name == $mc and (.gameVersionTypeID as $t | $mcTypes | index($t)))
                or ((.name == "NeoForge" or .name == "Java 25" or .name == "Client" or .name == "Server")
                    and (.gameVersionTypeID as $t | $other | index($t)))) | .id ]' cf-versions.json)
          count=$(echo "$ids" | jq length)
          if [ "$count" != 5 ]; then echo "CurseForge: expected 5 version ids for $MC, got $ids"; exit 1; fi
          changelog=$(printf '%s' "$MESSAGE" | head -1 | sed 's/; version [0-9.]*$//; s/ *\[curseforge\]//')
          jq -n --arg log "$changelog" --arg name "FactoryCraft $ver (Minecraft $MC)" --argjson ids "$ids" \
            '{changelog: $log, changelogType: "markdown", displayName: $name, gameVersions: $ids, releaseType: "release"}' > cf-meta.json
          cat cf-meta.json
          upload=false
          case "$GITHUB_REF" in refs/heads/main|refs/heads/mc-26.1)
            if [ "$CREATED" = true ] || printf '%s' "$MESSAGE" | grep -q '\[curseforge\]'; then upload=true; fi;;
          esac
          if [ "$upload" != true ]; then echo "CurseForge: dry run, nothing uploaded"; exit 0; fi
          cp "$jar" "factorycraft-${ver}-mc${MC}.jar"
          code=$(curl -s -o cf-response.json -w '%{http_code}' -H "X-Api-Token: $CF_TOKEN" \
            -F "metadata=<cf-meta.json" -F "file=@factorycraft-${ver}-mc${MC}.jar" "$api/projects/$CF_PROJECT/upload-file")
          echo "CurseForge upload: HTTP $code $(cat cf-response.json)"
          [ "$code" = 200 ]
      - name: Server smoke test
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GUIDE_DEMO: 'true' 
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:normal\n' > run/server/server.properties
          ./gradlew runServer --no-configuration-cache $VERSION_ARGS > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 150); do
            if grep -q 'Done (' server.log; then echo "Server started"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "Server process ended"; break; fi
            sleep 4
          done
          sleep 55
          kill $PID 2>/dev/null || true
          pkill -f 'net.neoforged' 2>/dev/null || true
          {
            if grep -q 'Done (' server.log; then echo '### [${{ matrix.mc }}] Server started OK'; else echo '### [${{ matrix.mc }}] Server did NOT start'; fi
            echo '```'
            grep -o "SELFTEST.*\|TERRAINTEST.*\|MATERIALSTEST.*\|EXOTICTEST.*\|FORGETEST.*\|ENERGYTEST.*\|FARMTEST.*\|LOGISTICSTEST.*\|DEFENSETEST.*\|ENVTEST.*\|ENDGAMETEST.*\|RESEARCHTEST.*\|BONDEDTEST.*\|MODULETEST.*\|RECIPETEST.*\|ASSEMBLERTEST.*\|BUSTEST.*\|SIDETEST.*\|FUELTEST.*\|OILTEST.*\|BATHTEST.*\|TANKTEST.*\|ENCHANTTEST.*\|ADVTEST.*\|DIAGTEST.*" server.log | tail -26
            grep -E -i -B1 -A4 "exception|error|failed|couldn't|could not|unknown|missing|invalid" server.log \
              | grep -v -E "DEBUG|^\s*at java\.|^\s*at jdk\." | head -c 60000
            echo '```'
          } > server_report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@server_report.md
          grep -q 'Done (' server.log
      - name: Client smoke test (software OpenGL)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          mkdir -p run/client
          printf 'onboardAccessibility:false\nnarrator:0\nsoundDevice:""\n' > run/client/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-configuration-cache $VERSION_ARGS > client.log 2>&1 &
          PID=$!
          for i in $(seq 1 180); do
            if grep -q -E 'Sound engine started|Narrator library|Created: .*minecraft:textures/atlas/blocks' client.log && sleep 30; then echo "Client loaded"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "Client process ended"; break; fi
            sleep 5
          done
          kill $PID 2>/dev/null || true
          pkill -f 'net.neoforged' 2>/dev/null || true
          {
            echo '### [${{ matrix.mc }}] Client log (filtered)'
            echo '```'
            grep -E -i -B1 -A3 "factorycraft|missing|unable to|exception|failed|couldn't" client.log \
              | grep -v -E "DEBUG|^\s*at java\.|^\s*at jdk\.|kqueue" | head -c 60000
            echo '```'
          } > client_report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@client_report.md
      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-mc${{ matrix.mc }}
          path: build/libs/*.jar
