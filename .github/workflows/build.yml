name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-configuration-cache 2>&1 | tee build.log
      - name: Report errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build failed'
            echo '```'
            grep -E -A3 "error:|What went wrong|FAILURE|Exception" build.log | head -c 60000
            echo '```'
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: factorycraft-jar
          path: build/libs/*.jar
