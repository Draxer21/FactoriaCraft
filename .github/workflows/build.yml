name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-configuration-cache > build.log 2>&1 || true
          J=$(find .gradle/repositories -name "neoforge-*.jar" | grep -v -E "sources|userdev|universal" | head -1)
          U=$(find ~/.gradle -name "neoforge-*-universal.jar" | head -1)
          CP="$J:$U:$(find ~/.gradle -name '*.jar' | tr '\n' ':')"
          {
          echo "### probe caps2"; echo '```'
          for c in net.neoforged.neoforge.transfer.transaction.SnapshotJournal net.neoforged.neoforge.transfer.energy.EnergyHandlerUtil net.neoforged.neoforge.transfer.ResourceHandlerUtil net.neoforged.neoforge.transfer.access.ItemAccess net.neoforged.neoforge.capabilities.ICapabilityProvider net.neoforged.neoforge.transfer.fluid.FluidStacksResourceHandler net.neoforged.neoforge.capabilities.BlockCapabilityCache; do
            echo "== $c"; javap -cp "$CP" -p "$c" 2>&1 | grep -v "lambda\|synthetic" | head -40
          done
          echo "== hooks"; javap -cp "$CP" -c -p net.neoforged.neoforge.capabilities.CapabilityHooks | grep -E "Method|Field" | grep -i -E "register|WorldlyContainer|Container|ENTITY_AUTOMATION|instanceof" | head -30
          unzip -Z1 $U | grep -E "neoforge/transfer/(fluid|item)/" | sed 's/\.class$//' | grep -v '\$' | sort
          echo '```'; } > report.md 2>&1
          head -c 60000 report.md > r2.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@r2.md
