name: Probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/probe'
    runs-on: ubuntu-latest
    steps:
      - name: CurseForge versions
        env:
          GH_TOKEN: ${{ github.token }}
          CF: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          {
          echo '```'
          [ -n "$CF" ] && echo "token present (${#CF} chars)" || echo "NO TOKEN"
          curl -s -o types.json -w "types http=%{http_code}\n" -H "X-Api-Token: $CF" https://minecraft.curseforge.com/api/game/version-types
          curl -s -o versions.json -w "versions http=%{http_code}\n" -H "X-Api-Token: $CF" https://minecraft.curseforge.com/api/game/versions
          jq -c '.[] | select(.slug|test("26|modloader|java|environment|addons"))' types.json | head -40
          echo ---
          jq -c '.[] | select(.name|test("^26\\.|NeoForge|^Java 2|^Client$|^Server$"))' versions.json | head -60
          head -c 300 types.json
          echo '```'
          } > report.md 2>&1
          head -c 65000 report.md > r2.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@r2.md
