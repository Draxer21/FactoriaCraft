name: Probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Jade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir j && cd j
          {
          echo '```'
          for gv in 26.2 26.1.2 26.1; do
            curl -s "https://api.modrinth.com/v2/project/jade/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%22$gv%22%5D" > v.json
            python3 -c "import json;d=json.load(open('v.json'));print('$gv', [(v['version_number'],v['id'],v['files'][0]['filename']) for v in d[:2]])"
          done
          url=$(curl -s "https://api.modrinth.com/v2/project/jade/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%2226.2%22%5D" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d[0]['files'][0]['url'] if d else '')")
          curl -sL "$url" -o jade.jar && unzip -q -o jade.jar -d jade
          curl -sI "https://api.modrinth.com/maven/maven/modrinth/jade/maven-metadata.xml" | head -1
          curl -s "https://api.modrinth.com/maven/maven/modrinth/jade/maven-metadata.xml" | grep -o "<version>[^<]*26[^<]*</version>" | tail -8
          for c in IWailaPlugin IWailaCommonRegistration IWailaClientRegistration IBlockComponentProvider IServerDataProvider IComponentProvider IToggleableProvider BlockAccessor Accessor ITooltip WailaPlugin config.IPluginConfig ui.IElementHelper ui.IElement ui.BoxStyle ui.IProgressStyle; do
            echo "== $c"; javap -cp jade snownee.jade.api.$c 2>&1 | head -40
          done
          echo '```'
          } > ../report.md 2>&1
          cd ..; head -c 65000 report.md > r2.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@r2.md
