name: Probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir b && cd b
          {
          echo '```'
          for slug in bonded amber; do
            curl -s "https://api.modrinth.com/v2/project/$slug/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%2226.2%22%5D" > $slug.json
            python3 -c "import json;d=json.load(open('$slug.json'));print('$slug', [(v['version_number'],v['files'][0]['url']) for v in d[:2]])"
            url=$(python3 -c "import json;d=json.load(open('$slug.json'));print(d[0]['files'][0]['url'] if d else '')")
            [ -n "$url" ] && curl -sL "$url" -o $slug.jar
          done
          unzip -o -q bonded.jar -d bonded
          for c in rules/BondedRulesLoader rules/GearRule rules/BondedRules leveling/levelers/RangedWeaponsLeveler leveling/levelers/MeleeWeaponsLeveler leveling/levelers/MiningToolsLeveler leveling/levelers/UtilityToolLeveler leveling/levelers/ArmorLeveler leveling/GameplayHooks registry/Tags registry/TierMap; do
            echo "== $c"; javap -p -c -constants -cp bonded com.iamkaf.bonded.$(echo $c | tr / .) 2>/dev/null | grep -E "ldc|public|private|static|getstatic|invoke(static|virtual|interface).*(Tag|is|Event|register|experience)" | grep -v "lambda" | head -45
          done
          echo "== resource files"; find bonded -type f ! -name "*.class" | grep -v "lang/\|textures/\|models/\|blockstates\|sounds" | head -60
          echo '```'
          } > ../report.md 2>&1
          cd ..; head -c 65000 report.md > r2.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@r2.md
