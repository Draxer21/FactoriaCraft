name: Probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: FluidModel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
          echo '```'
          for mc in 26.2 26.1; do
            echo "##### $mc"
            url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | python3 -c "import json,sys;d=json.load(sys.stdin);print([v['url'] for v in d['versions'] if v['id']=='$mc'][0])")
            jar=$(curl -s "$url" | python3 -c "import json,sys;print(json.load(sys.stdin)['downloads']['client']['url'])")
            curl -sL "$jar" -o c.jar
            for c in 'net.minecraft.client.renderer.block.FluidModel$Unbaked' net.minecraft.client.renderer.block.FluidModel net.minecraft.client.resources.model.sprite.Material net.minecraft.client.color.block.BlockTintSource; do
              echo "== $c"; javap -cp c.jar "$c" 2>&1 | head -25
            done
            javap -cp c.jar -c 'net.minecraft.client.renderer.block.FluidStateModelSet' 2>&1 | grep -i "water\|Unbaked\|Material" | head -20
          done
          echo '```'
          } > report.md 2>&1
          head -c 65000 report.md > r2.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@r2.md
