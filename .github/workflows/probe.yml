name: Probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-configuration-cache > build.log 2>&1 || true
          CP="$(find ~/.gradle .gradle build -name '*.jar' 2>/dev/null | tr '\n' ':')"
          {
          echo '```'
          for c in net.minecraft.world.level.saveddata.SavedData net.minecraft.world.level.saveddata.SavedDataType net.minecraft.world.level.storage.DimensionDataStorage net.neoforged.neoforge.attachment.AttachmentType 'net.neoforged.neoforge.attachment.AttachmentType$Builder' net.neoforged.neoforge.client.event.ViewportEvent 'net.neoforged.neoforge.client.event.ViewportEvent$RenderFog' 'net.neoforged.neoforge.client.event.ViewportEvent$ComputeFogColor' net.minecraft.world.item.crafting.RecipeManager net.minecraft.world.item.crafting.ShapedRecipe net.minecraft.world.item.crafting.ShapelessRecipe net.minecraft.world.item.crafting.Ingredient net.minecraft.world.item.crafting.PlacementInfo net.minecraft.world.item.ItemStackTemplate net.neoforged.neoforge.event.level.BlockEvent 'net.neoforged.neoforge.event.level.BlockEvent$EntityPlaceEvent' net.neoforged.neoforge.event.level.ExplosionEvent 'net.neoforged.neoforge.event.level.ExplosionEvent$Detonate' net.minecraft.world.level.ExplosionDamageCalculator; do
            echo "== $c"; javap -cp "$CP" "$c" 2>&1 | grep -v "lambda\|synthetic" | head -60
          done
          echo "== level getData"; javap -cp "$CP" net.minecraft.server.level.ServerLevel | grep -i -E "getDataStorage|isRainingAt" | head
          echo "== chunk attach"; javap -cp "$CP" net.minecraft.world.level.chunk.LevelChunk | grep -i -E "getData|setData|hasData" | head
          echo "== server recipes"; javap -cp "$CP" net.minecraft.server.MinecraftServer | grep -i -E "recipe" | head
          echo "== FogEvents"; unzip -Z1 $(find ~/.gradle -name "neoforge-*-universal.jar" | head -1) | grep -i fog | head
          echo '```'; } > report.md 2>&1
          head -c 65000 report.md > r2.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@r2.md
