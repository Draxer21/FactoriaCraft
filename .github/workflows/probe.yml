name: Probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: FluidModel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
          echo '```'
          for v in 26.2.0.93 26.1.2.122 26.1.0.19-beta; do
            echo "##### $v"
            curl -sL "https://maven.neoforged.net/releases/net/neoforged/neoforge/$v/neoforge-$v-universal.jar" -o nf.jar
            unzip -l nf.jar | grep -i "fluidmodel\|FluidModel\|RegisterFluid\|ClientFluidType" | awk '{print $4}' | head -20
            for c in $(unzip -l nf.jar | awk '{print $4}' | grep -i "fluidmodel\|RegisterFluidModel" | grep -v '\$' | sed 's/\.class$//;s#/#.#g' | head -6); do
              echo "== $c"; javap -cp nf.jar $c 2>&1 | head -30
            done
            unzip -l nf.jar | grep -i "fluid_model\|fluidmodel" | grep -v class | head
          done
          echo '```'
          } > report.md 2>&1
          head -c 65000 report.md > r2.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@r2.md
