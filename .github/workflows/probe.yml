name: Probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-configuration-cache > build.log 2>&1 || true
          U=$(find ~/.gradle -name "neoforge-*-universal.jar" | head -1)
          {
          echo '```'
          unzip -Z1 $U | grep -E "neoforge/event/" | grep -i -E "break|BreakSpeed|Harvest" | head -30
          echo '```'
          } > report.md 2>&1
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md
