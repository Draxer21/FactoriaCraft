name: Probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/probe'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CC0 sounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir s && cd s
          url=$(curl -sL https://opengameart.org/content/30-cc0-sfx-loops | grep -o 'https://opengameart.org/sites/default/files/[^"]*\.zip' | head -1)
          echo "oga=$url"
          curl -sL "$url" -o oga.zip && unzip -q -o oga.zip -d oga
          for page in sci-fi-sounds impact-sounds; do
            k=$(curl -sL https://opengameart.org/content/$page | grep -o 'https://opengameart.org/sites/default/files/[^"]*\.zip' | head -1)
            echo "$page=$k"; curl -sL "$k" -o $page.zip && unzip -q -o $page.zip -d kenney/$page || true
          done
          mkdir -p ../out
          find oga kenney -type f \( -iname '*.wav' -o -iname '*.ogg' -o -iname '*.mp3' -o -iname '*.flac' \) | while read f; do
            n=$(echo "$f" | sed 's|/|__|g; s| |_|g'); n="${n%.*}.ogg"
            ffmpeg -loglevel error -y -i "$f" -ac 1 -ar 44100 -c:a libvorbis -q:a 4 "../out/$n"
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "../out/$n")
            echo "$n $d" >> ../out/list.txt
          done
          find oga kenney -iname '*licen*' -o -iname '*.txt' -o -iname '*.md' | head -20 | while read f; do echo "== $f"; head -30 "$f"; done > ../out/licenses.txt
          cd ../out && git init -q && git checkout -q -b sound-probe && git add . && git -c user.name=ci -c user.email=ci@local commit -qm sounds
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" sound-probe
